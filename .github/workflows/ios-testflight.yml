# Builds the iPhone app on a Mac in GitHub and sends it to TestFlight, so no
# one needs a Mac of their own. Run it by hand: Actions > iPhone app to
# TestFlight > Run workflow.
#
# Needs four repository secrets, made once after the Apple developer account
# is open (mobile/README.md, "Sending the iPhone app"):
#   APPLE_TEAM_ID              the 10-character Team ID (Membership details)
#   ASC_KEY_ID                 App Store Connect API key ID
#   ASC_ISSUER_ID              that key's Issuer ID
#   ASC_KEY_P8                 the key's .p8 file, pasted in whole
# Signing is automatic: Xcode makes the certificate and profile with the key.
name: iPhone app to TestFlight

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testflight:
    name: Build and upload
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Copy the web app into the iPhone project
        working-directory: mobile
        run: npm ci && npm run web && npx cap sync ios
      - name: Write the API key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s' "$ASC_KEY_P8" > "$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8"
      - name: Archive
        working-directory: mobile/ios/App
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          xcodebuild -project App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$TEAM" CODE_SIGN_STYLE=Automatic \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            archive
      - name: Upload to App Store Connect
        working-directory: mobile/ios/App
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          sed "s/TEAM_ID/$TEAM/" ci/ExportOptions.plist > "$RUNNER_TEMP/ExportOptions.plist"
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID"
      - name: Remove the key
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"
