<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Library share card</title>
<!-- The 1200×630 picture Facebook, WhatsApp and others show under a shared
     library link. render.js fills it per language (window.render) and saves
     app/assets/og/<slug>.jpg. Fonts are the machine's own: install the Noto
     families first so every script draws. -->
<style>
@property --ang { syntax: '<angle>'; inherits: true; initial-value: 0deg; }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 1200px; height: 630px; overflow: hidden; background: #0b0714; }
body { font-family: 'Inter Display', 'Inter', 'Noto Sans', 'Noto Sans Devanagari', 'Noto Sans Gurmukhi',
  'Noto Naskh Arabic', 'Noto Sans Ethiopic', 'WenQuanYi Zen Hei', sans-serif; color: #F7F3FA;
  -webkit-font-smoothing: antialiased; }
#stage { position: relative; width: 1200px; height: 630px; overflow: hidden;
  background: radial-gradient(120% 120% at 0% 0%, #3a1a52 0%, #1a0f2c 45%, #0b0714 100%); }
.blob { position: absolute; border-radius: 50%; filter: blur(90px); mix-blend-mode: screen; }
.b1 { width: 620px; height: 620px; left: -220px; top: -260px; background: #8a3fb4; opacity: .65; }
.b2 { width: 520px; height: 520px; right: 120px; bottom: -330px; background: #d39a1f; opacity: .42; }
.b3 { width: 560px; height: 560px; right: -260px; top: -200px; background: #2f86b0; opacity: .5; }
.b4 { width: 380px; height: 380px; left: 360px; top: 300px; background: #d0508f; opacity: .22; }
.grid { position: absolute; inset: 0; opacity: .07;
  background-image: linear-gradient(rgba(255,255,255,.6) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.6) 1px, transparent 1px);
  background-size: 60px 60px; mask-image: radial-gradient(70% 70% at 30% 40%, #000, transparent); }
.grain { position: absolute; inset: 0; opacity: .08; mix-blend-mode: overlay;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); }
.shard { position: absolute; mix-blend-mode: screen; filter: blur(1.5px); opacity: .5;
  background: linear-gradient(135deg, rgba(255,110,199,.6), rgba(255,211,110,.5) 30%, rgba(110,255,176,.45) 55%, rgba(110,200,255,.55) 75%, rgba(176,110,255,.6));
  clip-path: polygon(50% 0, 100% 100%, 0 80%); }
.sh1 { width: 300px; height: 380px; left: 600px; top: -120px; rotate: 28deg; }
.sh2 { width: 180px; height: 220px; left: -60px; bottom: -70px; rotate: -20deg; opacity: .35; }

.glass { position: absolute; border-radius: 28px;
  background: linear-gradient(140deg, rgba(255,255,255,.17), rgba(255,255,255,.05) 45%, rgba(255,255,255,.09));
  backdrop-filter: blur(22px) saturate(170%);
  box-shadow: inset 0 1.5px 0 rgba(255,255,255,.45), inset 0 -1px 0 rgba(255,255,255,.08), 0 30px 70px rgba(0,0,0,.45); }
.glass::before { content: ''; position: absolute; inset: 0; border-radius: inherit; padding: 2px; pointer-events: none;
  background: conic-gradient(from 210deg, #ff6ec7, #ffd36e, #6effb0, #6ec8ff, #b06eff, #ff6ec7);
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; opacity: .8; }

.brand { position: absolute; left: 64px; top: 52px; display: flex; align-items: center; gap: 14px;
  font-weight: 800; font-size: 28px; letter-spacing: -.01em; }
.brand svg { width: 46px; height: 46px; filter: drop-shadow(0 4px 12px rgba(232,163,23,.45)); }
.free { margin-left: 10px; padding: 6px 14px; border-radius: 999px; font-size: 17px; font-weight: 800; letter-spacing: .06em;
  background: linear-gradient(90deg, #F0B942, #ffd98a); color: #3A2A05; }

.copy { position: absolute; left: 64px; top: 140px; width: 650px; text-align: left; }
.copy > * { text-align: left; }
.native { font-weight: 900; font-size: 104px; line-height: 1.04; letter-spacing: -.035em;
  background: linear-gradient(100deg, #fff 0%, #fff 35%, #ffe3a3 60%, #F0B942 100%);
  -webkit-background-clip: text; background-clip: text; color: transparent;
  filter: drop-shadow(0 6px 22px rgba(0,0,0,.35)); padding-bottom: 6px; white-space: nowrap; }
.native.long { font-size: 82px; } .native.longer { font-size: 64px; }
.title { margin-top: 14px; font-weight: 700; font-size: 36px; line-height: 1.22; color: #EADFF2; max-width: 640px; }
.title.long { font-size: 30px; }
.chips { position: absolute; left: 64px; bottom: 124px; display: flex; gap: 14px; }
.chip { position: relative; display: flex; align-items: center; gap: 10px; padding: 13px 20px 13px 16px; border-radius: 18px;
  font-weight: 800; font-size: 22px; }
.chip svg { width: 28px; height: 28px; }
.chip.c1 svg { color: #ffd36e; } .chip.c2 svg { color: #6ec8ff; } .chip.c3 svg { color: #6effb0; }
.url { position: absolute; left: 64px; bottom: 48px; display: flex; align-items: center; gap: 12px;
  font-weight: 800; font-size: 26px; color: #fff; }
.url .dot { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center;
  background: linear-gradient(135deg, #4FBE72, #2f9a55); box-shadow: 0 6px 18px rgba(79,190,114,.45); }
.url .dot svg { width: 22px; height: 22px; color: #fff; }
.url b { color: #F0B942; }

.phone { position: absolute; right: 70px; top: 46px; width: 300px; height: 620px; border-radius: 46px; padding: 12px;
  transform: rotate(6deg); background: linear-gradient(160deg, #2a2236, #110c18);
  box-shadow: 0 0 0 2px rgba(255,255,255,.18), 0 40px 80px rgba(0,0,0,.55), 0 0 120px rgba(176,110,255,.35); }
.phone .screen { width: 100%; height: 100%; border-radius: 36px; overflow: hidden; background: #fffaf2 center top / 100% auto no-repeat; }
.phone::after { content: ''; position: absolute; inset: 12px; border-radius: 36px; pointer-events: none;
  background: linear-gradient(115deg, rgba(255,255,255,.28) 0%, rgba(255,255,255,0) 32%); }
.phone .notch { position: absolute; left: 50%; top: 22px; width: 92px; height: 24px; margin-left: -46px; border-radius: 14px; background: #0b0714; }

/* home card: the whole library in many languages */
body.home .native { font-size: 76px; white-space: normal; }
.cloud { position: absolute; right: 36px; top: 36px; width: 440px; height: 560px; display: flex; flex-wrap: wrap;
  align-content: center; justify-content: center; gap: 9px; transform: rotate(-4deg); }
.cloud span { position: relative; padding: 7px 13px; border-radius: 14px; font-weight: 800; font-size: 19px; white-space: nowrap; }
</style>
</head>
<body>
<div id="stage">
  <div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div><div class="blob b4"></div>
  <div class="grid"></div><div class="shard sh1"></div><div class="shard sh2"></div>
  <div class="brand" dir="ltr"><span id="lantern"></span><span id="brand">The Library</span></div>
  <div class="copy">
    <h1 class="native" id="native" dir="auto"></h1>
    <p class="title" id="title" dir="auto"></p>
  </div>
  <div class="chips" id="chips"></div>
  <div class="url"><span class="dot" id="link-ico"></span><span id="url"></span></div>
  <div class="phone" id="phone"><div class="screen" id="screen"></div><div class="notch"></div></div>
  <div class="cloud" id="cloud" hidden></div>
  <div class="grain"></div>
</div>
<script>
var ICONS = {
  film: '<rect x="3" y="4" width="18" height="16" rx="2.5"/><path d="M7 4v16M17 4v16M3 12h18M3 8h4M3 16h4M17 8h4M17 16h4"/>',
  audio: '<path d="M3 12h2M8 6v12M12 3v18M16 8v8M20 11h1"/>',
  book: '<path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H19v15H6.5A2.5 2.5 0 0 0 4 20.5z"/><path d="M4 20.5A2.5 2.5 0 0 1 6.5 18H19v3H6.5A2.5 2.5 0 0 1 4 20.5z"/>',
  link: '<path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"/><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/>'
};
function svg(name) {
  return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">' + ICONS[name] + '</svg>';
}
function text(id, value) { document.getElementById(id).textContent = value; }
/* data: { native, title, labels: [film, audio, scripture], url, shot (data URL), lantern (svg),
   lang, home: [names] } */
window.render = function (d) {
  document.documentElement.lang = d.lang || 'en';
  document.getElementById('lantern').innerHTML = d.lantern || '';
  document.getElementById('link-ico').innerHTML = svg('link');
  text('native', d.native); text('title', d.title);
  var n = document.getElementById('native');
  n.classList.toggle('long', d.native.length > 9);
  n.classList.toggle('longer', d.native.length > 13);
  document.getElementById('title').classList.toggle('long', d.title.length > 34);
  document.getElementById('url').innerHTML = d.url.replace(/^([^/]+)(\/.*)?$/, function (_, host, path) {
    return host + (path ? '<b>' + path.replace(/&/g, '&amp;').replace(/</g, '&lt;') + '</b>' : '');
  });
  document.getElementById('chips').innerHTML = ['film', 'audio', 'book'].map(function (icon, i) {
    return '<span class="chip glass c' + (i + 1) + '">' + svg(icon) + '<span dir="auto"></span></span>';
  }).join('');
  document.querySelectorAll('#chips .chip > span').forEach(function (s, i) { s.textContent = d.labels[i]; });
  if (d.home) {
    document.body.classList.add('home');
    document.getElementById('phone').hidden = true;
    var cloud = document.getElementById('cloud'); cloud.hidden = false;
    var colours = ['#ffd36e', '#6ec8ff', '#6effb0', '#ff9ed8', '#c7a6ff', '#fff'];
    cloud.innerHTML = d.home.map(function (name, i) {
      return '<span class="glass" dir="auto" style="color:' + colours[i % colours.length] + '"></span>';
    }).join('');
    cloud.querySelectorAll('span').forEach(function (s, i) { s.textContent = d.home[i]; });
  } else {
    document.getElementById('screen').style.backgroundImage = 'url(' + d.shot + ')';
  }
  // Shrink the language name until it fits the left column.
  var size = parseFloat(getComputedStyle(n).fontSize);
  while (n.scrollWidth > 650 && size > 40) { size -= 4; n.style.fontSize = size + 'px'; }
  return document.fonts.ready.then(function () { return true; });
};
</script>
</body>
</html>
