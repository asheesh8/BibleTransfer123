<!doctype html>
<html lang="ny" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<base href="../">
<title>Laibulale ya Baibulo mu Chichewa</title>
<meta name="description" content="Baibulo, mafilimu ndi zomvetsera zachikhristu m’Chichewa (Chinyanja).">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="assets/icon/apple-touch-icon.png">
<link rel="icon" href="assets/icon/favicon-32.png" sizes="32x32">
<meta name="theme-color" content="#4E1F64">
<link rel="stylesheet" href="assets/css/app.css">
<link rel="stylesheet" href="assets/css/consent.css">
<script>
window.ET_SHARED_LIBRARY = {"lang":"nya","ui":"ny","slug":"chichewa","name":"Chichewa","native":"Chichewa"};
// Older installed shells may not know this newly added interface. Refresh
// only after the current worker has installed and can serve the new strings.
if ('serviceWorker' in navigator) navigator.serviceWorker.addEventListener('controllerchange', function () {
  var ui = window.ET_SHARED_LIBRARY.ui;
  if (document.documentElement.lang !== ui || !window.ET || !window.ET.i18n || window.ET.i18n.meta(ui).code !== ui) location.reload();
});
try {
  var theme = localStorage.getItem("et.theme");
  if (theme) document.documentElement.setAttribute("data-theme", theme);
} catch (e) {}
</script>
</head>
<body>
<main class="wrap" id="main">
  <section class="shared-hero">
    <p class="eyebrow" id="shared-badge">Chichewa basi</p>
    <h1 id="shared-title" dir="auto">Laibulale ya Baibulo mu Chichewa</h1>
    <p class="muted" id="shared-lead">Zinthu za mu laibulale iyi zili mu Chichewa.</p>
    <div class="btn-row shared-actions">
      <a class="btn green" id="email-library" href="#">Tumizani laibulale iyi pa imelo</a>
      <button class="btn ghost" id="copy-library" type="button">Koperani ulalo</button>
    </div>
    <p class="sr" id="copy-status" aria-live="polite"></p>
  </section>

  <div class="search" style="margin-bottom:.9rem">
    <span id="search-ico"></span>
    <input type="search" id="q" data-i18n-placeholder="lib.search" placeholder="Sakani ndi dzina" autocomplete="off" enterkeyhint="search">
  </div>
  <p class="flabel" data-i18n="lib.kind">Mtundu</p>
  <div class="filters" id="type-filters" role="group" data-i18n-aria="lib.kind" aria-label="Mtundu"></div>
  <div id="bulk-controls"></div>
  <p class="muted" id="count" style="margin:1rem 0 .6rem"></p>
  <div class="row-list" id="results"></div>
  <div id="empty" hidden class="card center" style="padding:2rem 1.2rem">
    <div id="empty-art"></div>
    <h3 data-i18n="lib.none">Palibe chofanana ndi zimenezo</h3>
    <p class="muted" data-i18n="lib.none.sub">Yesani mawu afupiko, kapena dinani Zonse.</p>
    <button class="btn ghost" id="reset" data-i18n="lib.clear">Chotsani</button>
  </div>
  <div class="foot-nav"></div>
</main>
<div id="bulk-dock" class="bulk-dock" hidden></div>
<script defer src="data/catalog-nya.js"></script>
<script defer src="assets/js/core.js"></script>
<script defer src="assets/js/art.js"></script>
<script defer src="assets/js/i18n.js"></script>
<script defer src="assets/js/analytics.js"></script>
<script defer src="assets/js/save.js"></script>
<script defer src="assets/js/shared-library.js"></script>
<script defer src="assets/js/library.js"></script>
</body>
</html>
