<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Browse the library</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="assets/icon/apple-touch-icon.png">
<link rel="icon" href="assets/icon/favicon-32.png" sizes="32x32">
<meta name="theme-color" content="#4E1F64">
<!-- iOS reads these instead of the manifest for Add to Home Screen. -->
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Library">
<link rel="stylesheet" href="assets/css/app.css">
<script>
  try {
    var l = localStorage.getItem("et.lang");
    if (l) {
      document.documentElement.setAttribute("lang", l);
      document.documentElement.setAttribute("dir", l === "en" ? "ltr" : "rtl");
    }
    var t = localStorage.getItem("et.theme");
    if (t) document.documentElement.setAttribute("data-theme", t);
  } catch (e) {}
</script>
</head>
<body>
<main class="wrap" id="main">

  <div class="search" style="margin-bottom:.9rem">
    <span id="search-ico"></span>
    <input type="search" id="q" data-i18n-placeholder="lib.search"
           placeholder="Search by name" autocomplete="off" enterkeyhint="search">
  </div>

  <p class="flabel" data-i18n="lib.kind">Kind</p>
  <div class="filters" id="type-filters" role="group" aria-label="Kind"></div>

  <p class="flabel" data-i18n="lib.lang">Language</p>
  <div class="filters" id="lang-filters" role="group" aria-label="Language"></div>

  <div id="bulk-controls"></div>

  <p class="muted" id="count" style="margin:1rem 0 .6rem"></p>

  <div class="row-list" id="results"></div>
  <div id="empty" hidden class="card center" style="padding:2rem 1.2rem">
    <div id="empty-art"></div>
    <h3 data-i18n="lib.none">Nothing matches that</h3>
    <p class="muted" data-i18n="lib.none.sub">Try a shorter word, or tap All.</p>
    <button class="btn ghost" id="reset" data-i18n="lib.clear">Clear</button>
  </div>

  <div class="foot-nav"></div>
</main>

<div id="bulk-dock" class="bulk-dock" hidden></div>

<script src="data/catalog.js"></script>
<script src="assets/js/core.js"></script>
<script src="assets/js/art.js"></script>
<script src="assets/js/i18n.js"></script>
<script src="assets/js/save.js"></script>
<script src="assets/js/library.js"></script>
</body>
</html>
