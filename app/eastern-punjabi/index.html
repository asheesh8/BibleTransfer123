<!doctype html>
<html lang="pa" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<base href="../">
<title>Eastern Punjabi Bible Library</title>
<meta name="description" content="Films, Scripture and audio in Eastern Punjabi.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="assets/icon/apple-touch-icon.png">
<link rel="icon" href="assets/icon/favicon-32.png" sizes="32x32">
<meta name="theme-color" content="#4E1F64">
<link rel="stylesheet" href="assets/css/app.css">
<script>
window.ET_SHARED_LIBRARY = {"lang":"pan","ui":"pa","slug":"eastern-punjabi","name":"Eastern Punjabi","native":"ਪੰਜਾਬੀ"};
try {
  var theme = localStorage.getItem("et.theme");
  if (theme) document.documentElement.setAttribute("data-theme", theme);
} catch (e) {}
</script>
</head>
<body>
<main class="wrap" id="main">
  <section class="shared-hero">
    <p class="eyebrow" id="shared-badge">ਪੰਜਾਬੀ only</p>
    <h1 id="shared-title" dir="auto">ਪੰਜਾਬੀ Bible Library</h1>
    <p class="muted" id="shared-lead">Everything on this page is in ਪੰਜਾਬੀ.</p>
    <div class="btn-row shared-actions">
      <a class="btn green" id="email-library" href="#">Email this library</a>
      <button class="btn ghost" id="copy-library" type="button">Copy link</button>
    </div>
    <p class="sr" id="copy-status" aria-live="polite"></p>
  </section>

  <div class="search" style="margin-bottom:.9rem">
    <span id="search-ico"></span>
    <input type="search" id="q" data-i18n-placeholder="lib.search" placeholder="Search by name" autocomplete="off" enterkeyhint="search">
  </div>
  <p class="flabel" data-i18n="lib.kind">Kind</p>
  <div class="filters" id="type-filters" role="group" aria-label="Kind"></div>
  <div id="bulk-controls"></div>
  <p class="muted" id="count" style="margin:1rem 0 .6rem"></p>
  <div class="row-list" id="results"></div>
  <div id="empty" hidden class="card center" style="padding:2rem 1.2rem">
    <div id="empty-art"></div>
    <h3 data-i18n="lib.none">Nothing matches that</h3>
    <p class="muted" data-i18n="lib.none.sub">Try a shorter word, or tap All.</p>
    <button class="btn ghost" id="reset" data-i18n="lib.clear">Clear</button>
  </div>
  <div class="foot-nav"></div>
</main>
<div id="bulk-dock" class="bulk-dock" hidden></div>
<script src="data/catalog.js"></script>
<script src="assets/js/core.js"></script>
<script src="assets/js/art.js"></script>
<script src="assets/js/i18n.js"></script>
<script src="assets/js/save.js"></script>
<script src="assets/js/shared-library.js"></script>
<script src="assets/js/library.js"></script>
</body>
</html>
