<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Opening what you saved</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="assets/icon/apple-touch-icon.png">
<link rel="icon" href="assets/icon/favicon-32.png" sizes="32x32">
<meta name="theme-color" content="#4E1F64">
<!-- iOS reads these instead of the manifest for Add to Home Screen. -->
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Library">
<link rel="stylesheet" href="assets/css/app.css">
<script>
  try {
    var l = localStorage.getItem("et.lang");
    if (l) {
      document.documentElement.setAttribute("lang", l);
      document.documentElement.setAttribute("dir", l === "en" ? "ltr" : "rtl");
    }
    var t = localStorage.getItem("et.theme");
    if (t) document.documentElement.setAttribute("data-theme", t);
  } catch (e) {}
</script>
</head>
<body>
<main class="wrap" id="main">
  <p style="margin:1rem 0 .4rem">
    <a class="btn ghost" href="index.html" style="min-height:46px;padding:.5rem 1rem">
      <span id="back-ico"></span><span data-i18n="help.back">Back to the library</span></a>
  </p>

  <h1 data-i18n="help.title">Opening what you saved</h1>
  <div id="help" class="stack" style="margin-top:1.2rem"></div>

  <div class="foot-nav"></div>
</main>

<script src="data/catalog.js"></script>
<script src="assets/js/core.js"></script>
<script src="assets/js/i18n.js"></script>
<script src="assets/js/help.js"></script>
</body>
</html>
