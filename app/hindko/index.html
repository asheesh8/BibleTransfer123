<!doctype html>
<html lang="ur" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<base href="../">
<!-- /hindko: DBS lists Hindko as two languages, each with its own library
     (Northern hno, Southern hnd). This page lets a reader pick one.
     Links shared and QR codes printed for /hindko land here. Hand-written:
     not a language page, so it is in OTHER_PAGES in packer/et/generate.py. -->
<title>ہندکو بائبل لائبریری</title>
<meta name="description" content="اپنی ہندکو چنیں: شمالی یا جنوبی ہندکو۔ بائبل، فلمیں اور مسیحی آڈیو۔">
<meta property="og:type" content="website">
<meta property="og:site_name" content="The Library">
<meta property="og:url" content="https://www.bibletransfer123.org/hindko">
<meta property="og:title" content="ہندکو بائبل لائبریری">
<meta property="og:description" content="شمالی اور جنوبی ہندکو میں مفت بائبل فلمیں، آڈیو اور کلامِ مقدس۔ اپنی ہندکو چنیں!">
<meta property="og:image" content="https://www.bibletransfer123.org/assets/og/hindko.jpg?v=1">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="assets/icon/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="assets/icon/apple-touch-icon.png">
<meta name="theme-color" content="#7A2C5E">
<link rel="stylesheet" href="assets/css/tokens.css">
<link rel="stylesheet" href="assets/css/components/button.css">
<link rel="stylesheet" href="assets/css/app.css">
<style>
  .pick { list-style: none; margin: 1.2rem 0 0; padding: 0; display: grid; gap: .8rem; }
  .pick a { display: block; padding: 1rem 1.15rem; border-radius: var(--et-radius-lg, 16px); text-decoration: none;
    background: var(--et-surface, #fff); color: inherit; border: 1.5px solid var(--et-line, rgba(0,0,0,.12)); }
  .pick a:hover, .pick a:focus-visible { border-color: var(--et-fill-brand, #7A2C5E); }
  .pick b { display: block; font-size: 1.35rem; line-height: 1.5; }
  .pick .latin { display: block; font-size: .95rem; opacity: .75; }
  .pick .where { display: block; margin-top: .25rem; font-size: 1rem; opacity: .85; }
</style>
<script>
try {
  var theme = localStorage.getItem("et.theme");
  if (theme) document.documentElement.setAttribute("data-theme", theme);
} catch (e) {}
</script>
</head>
<body>
<main class="wrap" id="main" style="padding-top:1.2rem">
  <section class="shared-hero">
    <p class="eyebrow">ہندکو</p>
    <h1>ہندکو بائبل لائبریری</h1>
    <p class="muted">ہندکو کی دو بڑی بولیاں ہیں، اور ہر ایک کی اپنی لائبریری ہے۔ اپنی ہندکو چنیں۔</p>
  </section>
  <ul class="pick">
    <li><a href="northern-hindko/">
      <b>شمالی ہندکو</b>
      <span class="latin" dir="ltr">Northern Hindko</span>
      <span class="where">ہزارہ: ایبٹ آباد، مانسہرہ اور ہری پور</span>
    </a></li>
    <li><a href="southern-hindko/">
      <b>جنوبی ہندکو</b>
      <span class="latin" dir="ltr">Southern Hindko</span>
      <span class="where">پشاور، کوہاٹ اور اٹک</span>
    </a></li>
  </ul>
  <p style="margin-top:1.4rem"><a class="btn ghost" href="library.html">پوری لائبریری</a></p>
</main>
<script>
// Keep ?src=… and other query words on the way to the chosen library.
if (location.search) {
  var links = document.querySelectorAll('.pick a');
  for (var i = 0; i < links.length; i++) links[i].setAttribute('href', links[i].getAttribute('href') + location.search);
}
</script>
</body>
</html>
