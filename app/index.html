<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title data-i18n="app.name">The Library</title>
<meta name="description" content="Films, Scripture and audio you can keep — no internet needed.">
<!-- og:start -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="The Library">
<meta property="og:url" content="https://www.bibletransfer123.org/">
<meta property="og:title" content="The Library: free Bible films, audio and Scripture">
<meta property="og:description" content="Films, audio Bibles and Scripture in 40+ languages. Watch, listen and read on any phone, then pass it on.">
<meta property="og:image" content="https://www.bibletransfer123.org/assets/og/home.jpg?v=1">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="The Library: free Bible films, audio and Scripture">
<meta name="twitter:card" content="summary_large_image">
<!-- og:end -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="assets/icon/apple-touch-icon.png">
<link rel="icon" href="assets/icon/favicon-32.png" sizes="32x32">
<meta name="theme-color" content="#6A35C2">
<!-- iOS reads these instead of the manifest for Add to Home Screen. -->
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Library">
<link rel="stylesheet" href="assets/css/app.css">
<link rel="stylesheet" href="assets/css/consent.css">
<!-- Applied before first paint so an RTL language never flashes left-to-right. -->
<script>
  try {
    var l = localStorage.getItem('et.lang');
    if (l) {
      document.documentElement.setAttribute('lang', l);
      document.documentElement.setAttribute('dir', /^(ur|snd|ps|pnb)$/.test(l) ? 'rtl' : 'ltr');
    }
    var t = localStorage.getItem('et.theme');
    if (t) document.documentElement.setAttribute('data-theme', t);
  } catch (e) {}
</script>
</head>
<body>

<main class="wrap" id="main">
  <div id="home">
    <section class="greet" role="status" lang="en" dir="ltr">
      <p class="eyebrow">The Library</p>
      <h1>Opening your library…</h1>
      <p class="muted">Films, Scripture and audio</p>
    </section>
  </div>
</main>

<script defer src="data/catalog-home.js"></script>
<script defer src="api/visibility"></script>

<script defer src="assets/js/analytics.js"></script>
<script defer src="assets/js/home.js"></script>
</body>
</html>
