<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title data-i18n="nearby.title">Send to a phone nearby</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="assets/icon/apple-touch-icon.png">
<link rel="icon" href="assets/icon/favicon-32.png" sizes="32x32">
<meta name="theme-color" content="#6A35C2">
<!-- iOS reads these instead of the manifest for Add to Home Screen. -->
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Library">
<link rel="stylesheet" href="assets/css/app.css">
<link rel="stylesheet" href="assets/css/consent.css">
<link rel="stylesheet" href="assets/css/tokens.css">
<link rel="stylesheet" href="assets/css/components/qr.css">
<link rel="stylesheet" href="assets/css/components/progress.css">
<link rel="stylesheet" href="assets/css/pages/nearby.css">
<script>
  try {
    var l = localStorage.getItem("et.lang");
    if (l) {
      document.documentElement.setAttribute("lang", l);
      document.documentElement.setAttribute("dir", /^(ur|snd|ps|pnb)$/.test(l) ? "rtl" : "ltr");
    }
    var t = localStorage.getItem("et.theme");
    if (t) document.documentElement.setAttribute("data-theme", t);
  } catch (e) {}
</script>
</head>
<body>
<main class="wrap" id="main">
  <!-- The page's name for screen readers; the tab bar shows it to everyone else. -->
  <h1 class="sr" data-i18n="tab.send">Send</h1>
<div id="nearby" class="card" style="margin-top:.6rem"></div>
  <div class="foot-nav"></div>
</main>

<script>
/* A page opened from one language's library (?only=xxx) needs only that
   language's records: tens of kilobytes instead of the 21 MB catalogue, which on 3G is the
   difference between a few seconds and twenty. Written here, during parsing,
   so it keeps its place ahead of the scripts below — off a card too. */
(function () {
  var m = /[?&]only=([a-z]{3})(?:[&#]|$)/.exec(location.search);
  document.write('<script defer src="data/catalog' + (m ? '-' + m[1] : '') + '.js"><\/script>');
})();
</script>
<script defer src="api/visibility"></script>
<script defer src="assets/js/visibility.js"></script>
<script defer src="assets/js/core.js"></script>
<script defer src="assets/js/ui/shell.js"></script>
<script src="assets/js/i18n-load.js"></script>
<script defer src="assets/js/i18n.js"></script>
<script defer src="assets/js/analytics.js"></script>
<script defer src="assets/js/save.js"></script>
<script defer src="assets/vendor/peerjs.min.js"></script>
<script defer src="assets/vendor/qrcode.js"></script>
<script defer src="assets/js/nearby.js"></script>
</body>
</html>
