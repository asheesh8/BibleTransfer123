<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Send to a phone nearby</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="assets/icon/apple-touch-icon.png">
<link rel="icon" href="assets/icon/favicon-32.png" sizes="32x32">
<meta name="theme-color" content="#4E1F64">
<!-- iOS reads these instead of the manifest for Add to Home Screen. -->
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Library">
<link rel="stylesheet" href="assets/css/app.css">
<script>
  try {
    var l = localStorage.getItem("et.lang");
    if (l) {
      document.documentElement.setAttribute("lang", l);
      document.documentElement.setAttribute("dir", l === "en" ? "ltr" : "rtl");
    }
    var t = localStorage.getItem("et.theme");
    if (t) document.documentElement.setAttribute("data-theme", t);
  } catch (e) {}
</script>
</head>
<body>
<main class="wrap" id="main">
<div id="nearby" class="card" style="margin-top:.6rem"></div>
  <div class="foot-nav"></div>
</main>

<script src="data/catalog.js"></script>
<script src="assets/js/core.js"></script>
<script src="assets/js/i18n.js"></script>
<script src="assets/js/save.js"></script>
<script src="assets/vendor/peerjs.min.js"></script>
<script src="assets/js/nearby.js"></script>
</body>
</html>
